<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالمي للمعلم - الابتدائية والمتوسطة الأولى بالوجه</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #800020; /* لون عنابي ملكي فاخر */
            --primary-light: #a31c3c;
            --accent: #d4af37; /* ذهبي */
            --bg-cream: #faf7f2;
            --bg-soft: #f4ece1;
            --text-dark: #2c221e;
            --text-muted: #6b5b53;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(128, 0, 32, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 30px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 900;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* تصميم مشغل الصوت العصري */
        .audio-player-box {
            background: var(--bg-soft);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: 1px dashed var(--accent);
        }

        .audio-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(128, 0, 32, 0.2);
            transition: all 0.3s ease;
        }

        .audio-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .audio-note {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>الابتدائية والمتوسطة الأولى بالوجه</h1>
        <p class="subtitle">من شغاف القلب.. نشكركم معلمينا فأنتِ خير ما فيها</p>

        <!-- صندوق الصوت التفاعلي المباشر -->
        <div class="audio-player-box">
            <p class="audio-note"><i class="fa-solid fa-volume-high"></i> اضغطي على زر التشغيل للاستماع للأنشوطة الترحيبية:</p>
            <button class="audio-btn" id="playAudioBtn" onclick="toggleAudio()">
                <i class="fa-solid fa-play" id="playIcon"></i> <span id="playText">تشغيل الصوت</span>
            </button>
            <!-- رابط الملف الصوتي المباشر الذي أرسلتيه -->
            <audio id="schoolAudio" preload="auto">
                <source src="https://pdftolink.io/file/r2_dXNlcnMvZ3Vlc3QvZGEwNWNjMWMtOTY4Ni00MWE2LWE3ODUtMmQ0N2RhNDkzMDNmLm1wNA" type="audio/mp4">
                متصفحك لا يدعم تشغيل الصوت.
            </audio>
        </div>
    </div>

    <footer>
        الإدارة العامة للتعليم بمنطقة تبوك &copy; 2026
    </footer>

    <script>
        const audio = document.getElementById('schoolAudio');
        const playBtn = document.getElementById('playAudioBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    playText.innerText = 'إيقاف مؤقت';
                }).catch(error => {
                    console.log("خطأ في التشغيل:", error);
                    alert("يرجى النقر مرة أخرى للسماح بتشغيل الصوت.");
                });
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                playText.innerText = 'تشغيل الصوت';
            }
        }
    </script>

</body>
</html>
